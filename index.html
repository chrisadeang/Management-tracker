<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A0C1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pollisum Action Tracker</title>
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">

</head>
<body>
<header class="banner"><div class="bn-in"><img class="logo" alt="Pollisum" src="/assets/logo.png"><span class="bn-label">Action<br>Tracker</span></div></header>
<div class="top"><div class="navbar"><nav class="tabs" role="tablist" id="tabs"></nav><div class="hr"><div class="clock" id="clock" aria-label="Current date and time"></div><div class="viewer"><label for="viewer">Viewing as</label><select id="viewer" title="Viewing as"></select></div></div></div></div>
<div class="wrap">
  <main id="main"></main>
</div>
<footer><div class="in"><span id="foot-note"></span><button class="btn sm" id="demo-toggle"></button></div></footer>
<button class="btn primary fab" data-act="new" id="fab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New action</button>
<nav class="bbar" id="bbar" aria-label="Main"></nav>
<div id="layer"></div>
<div id="toast-slot"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
